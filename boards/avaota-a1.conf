# Avaota A1
BOARD_NAME="avaota-a1"
DEVICE_DTS="allwinner/sun55i-t527-avaota-a1"
ARCH="arm64"
KERNEL_BRANCH="bsp"
KERNEL_GCC="aarch64-linux-gnu-"
BOOTARGS="root=LABEL=rootfs earlycon=uart8250,mmio32,0x02500000 clk_ignore_unused initcall_debug=0 console=tty1 console=ttyAS0,115200 loglevel=8 cma=64M init=/sbin/init rw fsck.fix=yes fsck.repair=yes net.ifnames=0"

case "${KERNEL_TARGET}" in

	bsp)
		# Linux 5.15 kernel configure
		LINUX_REPO="https://github.com/AvaotaSBC/linux.git"
		LINUX_GITEE_REPO="https://github.com/AvaotaSBC/linux.git"
		LINUX_BRANCH="linux-5.15"
		LINUX_CONFIG="sun55i_t527_bsp_defconfig"
		LINUX_PATHDIR="none"
		;;

esac

setup_dhcp(){
if [[ "${VERSION}" == "jammy" || "${VERSION}" == "noble" ]];then
    LC_ALL=C LANGUAGE=C LANG=C chroot ${ROOTFS} netplan set ethernets.eth0.dhcp4=true
    LC_ALL=C LANGUAGE=C LANG=C chroot ${ROOTFS} netplan set ethernets.eth0.dhcp6=true
    LC_ALL=C LANGUAGE=C LANG=C chroot ${ROOTFS} netplan set ethernets.eth1.dhcp4=true
    LC_ALL=C LANGUAGE=C LANG=C chroot ${ROOTFS} netplan set ethernets.eth1.dhcp6=true
    LC_ALL=C LANGUAGE=C LANG=C chroot "${ROOTFS}" /bin/sh -c 'chmod 600 /etc/netplan/*.yaml'
elif [[ "${VERSION}" == "bookworm" || "${VERSION}" == "trixie" || "${VERSION}" == "bullseye" || "${VERSION}" == "focal" ]];then
    LC_ALL=C LANGUAGE=C LANG=C chroot ${ROOTFS} apt-get update
    LC_ALL=C LANGUAGE=C LANG=C chroot ${ROOTFS} apt-get install ifupdown
fi
}

setup_display(){
    if [[ "${VERSION}" != "noble" || "${TYPE}" != "gnome" ]]; then
        return 0
    fi

    # GNOME 46's Wayland path fails to acquire a GBM front buffer on this BSP.
    sed -i 's/^#WaylandEnable=false$/WaylandEnable=false/' "${ROOTFS}/etc/gdm3/custom.conf"
    grep -qx 'WaylandEnable=false' "${ROOTFS}/etc/gdm3/custom.conf"

    # Select the HDMI display controller, rather than the render-only Mali GPU.
    # Match its driver so the configuration does not depend on DRM card numbers.
    mkdir -p "${ROOTFS}/etc/X11/xorg.conf.d"
    cat > "${ROOTFS}/etc/X11/xorg.conf.d/20-avaota-display.conf" <<'EOF'
Section "OutputClass"
    Identifier "Avaota A1 display controller"
    MatchDriver "sun4i-drm"
    Driver "modesetting"
    Option "PrimaryGPU" "true"
EndSection
EOF
}

# Bootloader
BL_CONFIG="sunxi-syterkit"
SYTERKIT_REPO="https://github.com/YuzukiHD/SyterKit"
SYTERKIT_BRANCH="main"
# Pin a CMake-based revision with the A1 4GB boot fix.
SYTERKIT_COMMIT="0998aeb48289058d26b3c24febb3405e29b66898"
SYTERKIT_TYPE="extlinux_boot"
